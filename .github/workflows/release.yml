name: Release

# Triggered by pushing a tag like v0.1.0, v0.2.0, etc. The tag's version
# (minus the leading "v") must match CFBundleShortVersionString in Info.plist
# so the produced filename — dist/QlabCueViewer-<version>.zip — exists.

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # for gh release create to attach the zip

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Build universal .app and zip
        run: make zip
      - name: Inspect output
        run: ls -lh dist/ && file QlabCueViewer.app/Contents/MacOS/QlabCueViewer
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP="dist/QlabCueViewer-${VERSION}.zip"
          test -f "$ZIP" || { echo "Missing $ZIP — does Info.plist version match the tag?"; exit 1; }
          gh release create "$GITHUB_REF_NAME" "$ZIP" \
            --title "QLab Cue Viewer ${VERSION}" \
            --notes "Universal macOS .app (Apple Silicon + Intel, requires macOS 14+). Unzip, drag QlabCueViewer.app to /Applications, right-click → Open on first launch to bypass Gatekeeper (build is ad-hoc signed, not notarized). See README for QLab + relay configuration."
